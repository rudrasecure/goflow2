[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
logfile_maxbytes=1MB
logfile_backups=1
loglevel=info

[program:goflow2]
command=/goflow2 -mapping /etc/goflow2/mapping.yaml -transport.file /var/log/flow.log
stdout_logfile=/var/log/goflow2_stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/goflow2_stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
autostart=true
autorestart=true
startretries=5
priority=10

[program:aggregator]
command=/aggregator -input /var/log/flow.log -output-dir /var/log/flows -period 5
stdout_logfile=/var/log/aggregator_stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/aggregator_stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
autostart=true
autorestart=true
startretries=5
priority=20
